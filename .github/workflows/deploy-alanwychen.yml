name: Publish app to alanwychen.github.io

on:
  workflow_call:
    inputs:
      app-path:
        description: Submodule path in the composite deployment repository
        required: true
        type: string
    secrets:
      COMPOSITE_DEPLOY_KEY:
        description: App deploy key; needed only for publication from main
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COMPOSITE_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          repository: AlanWYChen/AlanWYChen.github.io
          ref: main
          ssh-key: ${{ secrets.COMPOSITE_DEPLOY_KEY }}
      - name: Update this app's deployed revision
        env:
          GH_TOKEN: ${{ github.token }}
          APP_REPOSITORY: ${{ github.repository }}
          APP_REVISION: ${{ github.sha }}
          APP_PATH: ${{ inputs.app-path }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Retry against the latest deployment commit so simultaneous app pushes
          # preserve both submodule updates. Never publish an obsolete app push.
          for attempt in 1 2 3 4 5; do
            latest=$(gh api "repos/$APP_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$latest" != "$APP_REVISION" ]; then
              echo 'A newer app commit exists; its validation run owns publication.'
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            recorded_path=$(git config -f .gitmodules --get "submodule.$APP_PATH.path")
            test "$recorded_path" = "$APP_PATH"
            git update-index --add --cacheinfo "160000,$APP_REVISION,$APP_PATH"
            if git diff --cached --quiet; then
              echo 'This app revision is already recorded.'
              exit 0
            fi
            git -c commit.gpgsign=false commit -m "Publish $APP_PATH at $APP_REVISION"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'Unable to update deployment repository after five attempts.' >&2
          exit 1
